services:
  website:
    image: jekyll/jekyll:latest
    container_name: sagi-website
    working_dir: /srv/jekyll
    volumes:
      - .:/srv/jekyll
    ports:
      - "4001:4000"
    environment:
      JEKYLL_ENV: development
    command: >
      sh -c "bundle install && bundle exec jekyll serve --config _config.yml --watch --host 0.0.0.0 --port 4000"
    stdin_open: true
    tty: true
